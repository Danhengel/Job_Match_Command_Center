name: CareerOS CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, "feature/**", "fix/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build Next.js application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q app alembic
      - name: Run tests when present
        shell: bash
        run: |
          if find . \( -path '*/test_*.py' -o -path '*/tests/*.py' \) | grep -q .; then
            pytest -q
          else
            echo "No Python tests found; source compilation passed."
          fi

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobmatch
          POSTGRES_USER: jobmatch
          POSTGRES_PASSWORD: jobmatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobmatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://jobmatch:jobmatch@localhost:5432/jobmatch
      SECRET_KEY: ci-only-secret-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Alembic graph
        shell: bash
        run: |
          alembic heads
          test "$(alembic heads | wc -l)" -eq 1
      - name: Upgrade fresh database
        run: alembic upgrade head
      - name: Confirm current revision
        run: alembic current

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build application images
        run: docker compose build
