<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">CareerNavIQ</title>
  <desc id="desc">CareerNavIQ wordmark with Career in silver, Nav in teal, IQ in gold, and a compass integrated into the Q. Tagline: Clarity for What's Next.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03111f"/>
      <stop offset="0.52" stop-color="#071b2c"/>
      <stop offset="1" stop-color="#020914"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.34" stop-color="#dfe4e8"/>
      <stop offset="0.66" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9aa4ad"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28d4df"/>
      <stop offset="0.46" stop-color="#0b9caf"/>
      <stop offset="1" stop-color="#05677e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe58a"/>
      <stop offset="0.34" stop-color="#d8aa35"/>
      <stop offset="0.68" stop-color="#f2c85d"/>
      <stop offset="1" stop-color="#9c6917"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="12" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <text x="38" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="500" letter-spacing="-5" fill="url(#silver)">Career</text>
    <text x="500" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="500" letter-spacing="-5" fill="url(#teal)">Nav</text>
    <text x="777" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="500" fill="url(#gold)">I</text>

    <g transform="translate(890 28)">
      <circle cx="110" cy="110" r="88" fill="none" stroke="url(#gold)" stroke-width="15"/>
      <circle cx="110" cy="110" r="72" fill="#061625" stroke="#8b651d" stroke-width="2"/>
      <g fill="none" stroke="#d6a93b" stroke-width="2" opacity="0.72">
        <path d="M110 34v13M110 173v13M34 110h13M173 110h13"/>
        <path d="M56 56l9 9M155 155l9 9M164 56l-9 9M65 155l-9 9"/>
      </g>
      <path d="M110 43 123 96 177 110 123 124 110 177 97 124 43 110 97 96Z" fill="url(#silver)"/>
      <path d="M110 56 118 101 164 110 118 119 110 164 102 119 56 110 102 101Z" fill="url(#teal)" opacity="0.94"/>
      <circle cx="110" cy="110" r="18" fill="url(#gold)"/>
      <circle cx="110" cy="110" r="10" fill="#0aa7ba"/>
      <path d="M165 170c18 8 33 15 52 31-12-4-26-8-40-10-11-2-20-7-28-13Z" fill="url(#gold)"/>
    </g>
  </g>

  <line x1="240" y1="214" x2="960" y2="214" stroke="#c99a2d" stroke-width="2" opacity="0.9"/>
  <text x="600" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="11" fill="#f2f4f6">CLARITY FOR WHAT’S NEXT</text>
</svg>