<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" role="img" aria-labelledby="title desc">
  <title id="title">CareerNavIQ</title>
  <desc id="desc">CareerNavIQ wordmark with Career in silver, Nav in teal, IQ in gold, and a compass integrated into the Q.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#eef1f3"/>
      <stop offset="0.52" stop-color="#bfc5ca"/>
      <stop offset="0.78" stop-color="#f8f9fa"/>
      <stop offset="1" stop-color="#8f989f"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22e5ef"/>
      <stop offset="0.38" stop-color="#08bccc"/>
      <stop offset="0.72" stop-color="#0793a6"/>
      <stop offset="1" stop-color="#05667b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.28" stop-color="#f2c153"/>
      <stop offset="0.55" stop-color="#c88b1f"/>
      <stop offset="0.78" stop-color="#f7d46f"/>
      <stop offset="1" stop-color="#9b6615"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c67c16" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#ffcf61"/>
      <stop offset="1" stop-color="#c67c16" stop-opacity=".4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#00101e" flood-opacity=".72"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <text x="34" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="174" font-weight="500" letter-spacing="-7" fill="url(#silver)" stroke="#51585f" stroke-width="1.2">Career</text>
    <text x="535" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="174" font-weight="500" letter-spacing="-7" fill="url(#teal)" stroke="#025b6d" stroke-width="1.2">Nav</text>
    <text x="842" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="174" font-weight="500" fill="url(#gold)" stroke="#7e5513" stroke-width="1.2">I</text>

    <g transform="translate(930 28)">
      <circle cx="118" cy="118" r="93" fill="none" stroke="url(#gold)" stroke-width="17"/>
      <circle cx="118" cy="118" r="76" fill="#071b2c" stroke="#9d721f" stroke-width="2.5"/>
      <g fill="none" stroke="#d8a933" stroke-width="2" opacity=".8">
        <path d="M118 34v15M118 187v15M34 118h15M187 118h15"/>
        <path d="M59 59l11 11M166 166l11 11M177 59l-11 11M70 166l-11 11"/>
      </g>
      <path d="M118 34 132 101 202 118 132 135 118 202 104 135 34 118 104 101Z" fill="url(#gold)"/>
      <path d="M118 55 126 105 179 118 126 131 118 181 110 131 57 118 110 105Z" fill="url(#teal)"/>
      <circle cx="118" cy="118" r="16" fill="url(#gold)"/>
      <circle cx="118" cy="118" r="9" fill="#12bdd0" stroke="#e5faff" stroke-width="1.5"/>
      <path d="M183 188 C211 197 243 212 278 238 C246 230 217 225 191 217 C174 212 163 204 155 195 Z" fill="url(#gold)"/>
    </g>
  </g>

  <path d="M62 250 C390 210 780 210 1198 242 C1320 251 1435 265 1530 288" fill="none" stroke="#6b3f0b" stroke-width="7" opacity=".5"/>
  <path d="M62 246 C390 207 780 207 1198 238 C1320 247 1435 260 1530 282" fill="none" stroke="url(#goldLine)" stroke-width="3.5" filter="url(#glow)"/>
</svg>